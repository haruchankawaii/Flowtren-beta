[package]
name = "flowtren-desktop"
version = "0.1.0-beta.1"
description = "Flowtren desktop application"
authors = ["Flowtren"]
edition = "2021"

[lib]
name = "flowtren_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

polars = { version = "0.55.2", features = ["lazy", "csv"] }

flowtren-core = { path = "../../../crates/flowtren-core" }
flowtren-io = { path = "../../../crates/flowtren-io" }
flowtren-profiler = { path = "../../../crates/flowtren-profiler" }
flowtren-cleaner = { path = "../../../crates/flowtren-cleaner" }
flowtren-quality = { path = "../../../crates/flowtren-quality" }
flowtren-stats = { path = "../../../crates/flowtren-stats" }
flowtren-insights = { path = "../../../crates/flowtren-insights" }
flowtren-charts = { path = "../../../crates/flowtren-charts" }
flowtren-export = { path = "../../../crates/flowtren-export" }
